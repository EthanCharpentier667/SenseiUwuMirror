---
name: Feature Implementation
description: Plan and implement a feature from the Sensai catalog or a custom one.
labels: enhancement
title: "[FEATURE] <Feature Name>"
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this template to define a feature implementation. Remember that **User stories are not a formality**—they are the contract between technical choices and the problem you claim to solve.
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which category from the Sensai catalog does this feature belong to?
      options:
        - Base
        - Memory & Context
        - Tools
        - RAG
        - Orchestration & Reasoning
        - Evaluation
        - UX & Lifecycle
        - Custom Feature
    validations:
      required: true
  - type: input
    id: feature_id
    attributes:
      label: Feature ID
      description: The ID of the feature from the catalog (e.g., [M1], [T2]). Leave blank if it's a custom feature.
      placeholder: "[M1]"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description & Technical Tradeoffs
      description: What is the description of the feature? Explain your technical choices, what you considered, and why you chose this path.
    validations:
      required: true
  - type: textarea
    id: user_stories
    attributes:
      label: User Stories
      description: |
        You must write **at least two user stories** demonstrating real use cases for this feature.
        Format: As a [type of user], I want to [action], so that [outcome].
      placeholder: |
        **User Story 1:**
        As a developer, I want to ..., so that ...
        Acceptance criteria:
        - Observable behavior 1
        - Observable behavior 2

        **User Story 2:**
        As a data scientist, I want to ..., so that ...
        Acceptance criteria:
        - Observable behavior 1
        - Observable behavior 2
    validations:
      required: true
