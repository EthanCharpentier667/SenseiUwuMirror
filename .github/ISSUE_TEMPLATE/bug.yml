---
name: Bug Report
description: Report a bug, crash, or unexpected behavior in the AI assistant.
labels: bug
title: "[BUG] -"
body:
  - type: markdown
    attributes:
      value: |
        Please provide details about the bug you encountered.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - CLI Chatbot Base
        - Ollama Integration / API
        - Memory & Context
        - Tools & Sandboxing
        - RAG Pipeline
        - Orchestration & Agents
        - UI / UX
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      placeholder: |
        1. Start the CLI assistant with `python main.py --model llama3`
        2. Upload a PDF file
        3. Ask the assistant to summarize it
        4. Observe the crash or error message.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs Actual Behavior
      placeholder: |
        Expected: The assistant streams a summary of the PDF.
        Actual: The assistant crashes with an API connection error.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python 3.11, Ubuntu 22.04, Ollama v0.1.30, Llama3 8B
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic Logs / Tracebacks
      description: Paste any Python tracebacks, Ollama logs, or relevant error output.
      render: python
