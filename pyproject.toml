[project]
name = "sensai"
version = "0.1.0"
description = "LLM chatbot with unlimited functionalities !"
readme = "README.md"
authors = [
    { name = "EthanCharpentier667", email = "ethan.charpentier@epitech.eu" },
]
requires-python = ">=3.11"
dependencies = [
    "argparse>=1.4.0",
    "dotenv>=0.9.9",
    "peewee>=4.5.1",
    "requests>=2.34.2",
]

[project.scripts]
sensai = "sensai:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.5.0",
    "mkdocs-section-index>=0.3.12",
    "mkdocstrings[python]>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # one-blank-line-before-class: conflicts with D211 (we keep D211)
    "D213",   # multi-line-summary-second-line: conflicts with D212 (we keep D212)
    "COM812", # trailing-comma-missing: handled by the formatter
    "ISC001", # single-line-implicit-string-concat: handled by the formatter
    "ANN401", # any-type: LLM payloads/JSON often legitimately need `Any`
    "TD002",  # missing-todo-author: overkill for a solo/small team project
    "TD003",  # missing-todo-link: overkill for a solo/small team project
    "FIX002", # line-contains-todo: TODOs are fine to commit
    "EM101",  # raw-string-in-exception
    "EM102",  # f-string-in-exception
    "TRY003", # raise-vanilla-args: long, specific error messages are good
    "CPY001", # missing-copyright-notice: no copyright header policy (yet)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is expected in tests
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",    # docstrings not required in tests
    "PLR2004", # magic-value-comparison: fine in test assertions
    "ANN001",
    "ANN201",  # test functions rarely need full annotations
    "ANN202",  # same, for nested mock helpers
    "ANN204",  # same, for mock __init__ methods
    "ARG001",  # mock functions must match the signature they replace, even if unused
    "ARG005",  # same, for monkeypatched lambdas
    "TRY002",  # generic Exception is fine to simulate an arbitrary HTTP error
    "PT011",   # pytest.raises(ValueError) is fine here, message already asserted separately
]
"__init__.py" = ["D104"] # package docstring optional at the root
"docs/gen_ref_pages.py" = ["INP001"] # build-time script, not part of a package

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["sensai"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: static type checking (strict mode)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=sensai",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# coverage.py
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 80
show_missing = true
